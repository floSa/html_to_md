[project]
name = "fast-to-md"
version = "0.1.0"
description = "Convertit pages web et documents bureautiques en Markdown propre pour l'ingestion RAG"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15",
    "lxml[html_clean]>=6.1",
    "readability-lxml>=0.8.4",
    "markdownify>=1.2",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# Formats bureautiques (Word, PowerPoint, Excel, PDF, EPUB, e-mails…).
# Le HTML n'en a pas besoin ; installer avec `uv sync --extra docs`.
docs = [
    "mammoth>=1.11",
    "markitdown[outlook,pdf,pptx,xls,xlsx]>=0.1.7",
]

[project.scripts]
fast2md = "fast_to_md.cli:main"

[dependency-groups]
# Outils de développement, installés par défaut par `uv sync`.
# python-docx et python-pptx servent à fabriquer les fixtures bureautiques
# des tests plutôt qu'à versionner des binaires dans le dépôt.
dev = [
    "pytest>=8.4",
    "python-docx>=1.2",
    "python-pptx>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
